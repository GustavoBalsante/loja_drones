<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Pedido Confirmado - DroneShop</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800">

    <main class="container mx-auto mt-16 p-4 max-w-lg text-center">
        <div class="bg-white rounded-xl shadow-md p-8 border border-gray-200">
            <div class="text-6xl mb-4">🎉</div>
            <h1 class="text-3xl font-bold text-gray-900 mb-2">Pedido Realizado!</h1>
            <p class="text-gray-600 mb-4">Obrigado por comprar na DroneShop, <strong>{{ pedido.nome }}</strong>.</p>

            <div class="bg-gray-50 p-4 rounded-lg text-left text-sm text-gray-700 mb-6 space-y-1">
                <p><strong>Número do Pedido:</strong> #{{ pedido.id }}</p>
                <p><strong>Total:</strong> R$ {{ pedido.total }}</p>
                <p><strong>Endereço de Entrega:</strong> {{ pedido.endereco }} - {{ pedido.cidade }}</p>
            </div>

            <a href="{% url 'index' %}" class="inline-block bg-blue-600 hover:bg-blue-700 text-white font-bold px-6 py-3 rounded-lg shadow">
                Voltar à Página Inicial
            </a>
        </div>
    </main>

</body>
</html>
