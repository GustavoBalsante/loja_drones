<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Checkout - DroneShop</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800">

    <header class="bg-blue-900 text-white p-4 shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <a href="{% url 'index' %}" class="text-2xl font-bold">🚁 DroneShop</a>
            <a href="{% url 'ver_carrinho' %}" class="text-sm bg-blue-800 hover:bg-blue-700 text-white px-3 py-2 rounded">← Voltar ao Carrinho</a>
        </div>
    </header>

    <main class="container mx-auto mt-8 p-4 max-w-xl">
        <div class="bg-white rounded-xl shadow-md p-6 border border-gray-200">
            <h1 class="text-2xl font-bold mb-4 text-gray-900">Finalizar Pedido</h1>

            <p class="text-lg font-bold text-green-600 mb-6 border-b pb-4">
                Total a pagar: R$ {{ total }}
            </p>

            <form method="POST" action="{% url 'checkout' %}" class="space-y-4">
                {% csrf_token %}

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Nome Completo</label>
                    <input type="text" name="nome" required class="w-full border rounded-lg p-3 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">E-mail</label>
                    <input type="email" name="email" required class="w-full border rounded-lg p-3 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Endereço de Entrega</label>
                    <input type="text" name="endereco" required class="w-full border rounded-lg p-3 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Cidade</label>
                    <input type="text" name="cidade" required class="w-full border rounded-lg p-3 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                </div>

                <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-lg text-lg shadow transition mt-6">
                    Confirmar e Pagar
                </button>
            </form>
        </div>
    </main>

</body>
</html>
